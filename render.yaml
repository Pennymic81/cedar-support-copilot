# Render Blueprint: creates the web service and a Postgres database (with pgvector).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> set DEMO_ADMIN_PASSWORD -> Apply.
databases:
  - name: cedar-db
    plan: free
    databaseName: cedar
    user: cedar

services:
  - type: web
    name: cedar-support-copilot
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: cedar-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DEMO_ADMIN_PASSWORD
        sync: false # you type this in when you apply the Blueprint
      # AI: Google Gemini for answers and embeddings. Without LLM_API_KEY the app runs
      # fully offline (local mode), so a missing or removed key never breaks the site.
      - key: LLM_API_KEY
        sync: false # paste your Gemini API key in the Render dashboard (Environment tab)
      - key: LLM_PROVIDER
        value: openai # Gemini's OpenAI-compatible chat endpoint
      - key: LLM_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_CHAT_MODEL
        value: gemini-3.8-flash
      - key: LLM_REASONING_EFFORT
        value: low
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      # On deploy, build.sh re-embeds the documents, calibrates the threshold and re-runs the evals.
