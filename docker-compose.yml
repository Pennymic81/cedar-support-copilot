services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cedar
      POSTGRES_PASSWORD: cedar
      POSTGRES_DB: cedar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedar"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
